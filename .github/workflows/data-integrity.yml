name: DIDACTIC notebook data integrity

on:
  push:
    branches: [main, v0.5-isomerien-vergleich, v0.6-polaritaet-qualitaet, v0.7-feinschliff-restmodule, v0.8-stereochemie-glucose, v0.9a-dipol-labor, v0.9b-vektoraddition, v0.9c-basisset, v0.9d-experimenteller-bezug]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python cell and curated JSON
        run: python3 tests/validate_notebook.py
      - name: Install RDKit for descriptor regression
        run: python3 -m pip install --disable-pip-version-check rdkit py3Dmol ipywidgets pandas pillow
      - name: Validate molecular descriptors across all curated examples
        run: python3 tests/descriptor_regression.py
      - name: Validate pair-first Isomerie GUI and unchanged remaining modules
        run: python3 tests/isomer_interface_regression.py
      - name: Validate V0.6 polarity UI and chemistry corrections
        run: python3 tests/polarity_interface_regression.py
      - name: Validate v0.7 functional highlights, conformers and biomolecule quizzes
        run: python3 tests/restmodule_quality_v07.py
      - name: Validate v0.8 stereochemistry and D-glucose guided exploration
        run: python3 tests/stereochemistry_glucose_v08.py
      - name: Validate Atorvastatin structure and teaching workflow
        run: python3 tests/atorvastatin_v08.py
      - name: Validate cyclohexane chair, twist-boat, saddle boat and MW-024 workflow
        run: python3 tests/cyclohexane_reference_v08.py

      - name: Validate dipole basisset geometry and overlay workflow
        run: python3 tests/dipole_learning_v09a.py
