name: DIDACTIC notebook data integrity

on:
  push:
    branches: [main, v0.5-isomerien-vergleich, v0.6-polaritaet-qualitaet]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python cell and curated JSON
        run: python3 tests/validate_notebook.py
      - name: Install RDKit for descriptor regression
        run: python3 -m pip install --disable-pip-version-check rdkit py3Dmol ipywidgets pandas pillow
      - name: Validate molecular descriptors across all curated examples
        run: python3 tests/descriptor_regression.py
      - name: Validate pair-first Isomerie GUI and unchanged remaining modules
        run: python3 tests/isomer_interface_regression.py
      - name: Validate V0.6 polarity UI and chemistry corrections
        run: python3 tests/polarity_interface_regression.py
